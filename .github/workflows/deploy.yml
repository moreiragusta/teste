# Publica o site no GitHub Pages a cada push na branch main.
# Baseado no guia oficial do Astro: https://docs.astro.build/en/guides/deploy/github/
name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Endereço de teste: moreiragusta.github.io/teste. Remover quando usar o domínio próprio.
      SITE_URL: https://moreiragusta.github.io
      BASE_PATH: /teste/
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7
      - name: Instalar, gerar e enviar o site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
